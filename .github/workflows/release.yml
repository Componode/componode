name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (fallback only — used when no unreleased changesets exist)"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  version:
    name: Prepare version PR to develop
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Verify develop quality gates are green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Checking check runs for develop HEAD..."
          gh api "repos/${{ github.repository }}/commits/develop/check-runs" \
            --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion // "pending")"' | tee check-runs.txt
          if [ ! -s check-runs.txt ]; then
            echo "::error::No check runs found on develop HEAD — cannot verify gates. Refusing to start a release."
            exit 1
          fi
          if awk -F'\t' '$3 == "failure" || $3 == "cancelled" || $3 == "timed_out" || $3 == "action_required" { bad=1 } END { exit bad ? 0 : 1 }' check-runs.txt; then
            echo "::error::develop has failing check runs — resolve them before promoting. See above."
            exit 1
          fi
          if awk -F'\t' '$2 != "completed" { bad=1 } END { exit bad ? 0 : 1 }' check-runs.txt; then
            echo "::error::develop has check runs still in progress — wait for them to complete before promoting."
            exit 1
          fi
          echo "All develop check runs completed without failures."

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify changesets exist or add release-bump fallback
        run: |
          set -e
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "Unreleased changesets found; using their bump levels."
          else
            echo "No unreleased changesets found; creating release-bump changeset with bump '${{ github.event.inputs.bump }}'."
            cat > ".changeset/release-bump.md" <<EOF
          ---
          "componode": ${{ github.event.inputs.bump }}
          ---

          Release bump.
          EOF
          fi

      - name: Version with changesets
        run: pnpm changeset version

      - name: Create version pull request to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="chore/version-v${VERSION}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: version v${VERSION}" || { echo "No version changes produced — nothing to do."; exit 0; }
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: version v${VERSION}" \
            --body "Automated version preparation for v${VERSION}. Auto-merges when gates are green; the promotion PR to main opens after this lands." \
            --base develop \
            --head "$BRANCH")
          echo "Version PR: $PR_URL"
          gh pr merge --auto --squash "$PR_URL" || {
            echo "::warning::Could not enable auto-merge — is auto-merge enabled on the repository? Merge the PR manually when green."
          }
