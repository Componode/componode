name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check generated API docs are in sync
        run: pnpm --filter @componode/backend docs:api:check

      - name: Check generated importer docs are in sync
        run: pnpm --filter @componode/backend docs:importers:check

      - name: Check generated schema docs are in sync
        run: pnpm --filter @componode/backend docs:schema:check

      - name: Check docs sidebar coverage
        run: pnpm --filter @componode/backend docs:sidebar:check

      - name: Check docs oracle (env vars, services, importers, error codes)
        run: pnpm --filter @componode/backend docs:oracle:check

      - name: Build docs site
        run: pnpm docs:build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Playwright workload dependencies
        working-directory: playwright
        run: pnpm install --frozen-lockfile

      - name: Run Playwright e2e suite
        working-directory: playwright
        run: pnpm e2e

      - name: Tear down e2e stack
        if: always()
        working-directory: playwright
        run: pnpm e2e:down

  main-guard:
    # PRs to main may only come from develop (promotion) or hotfix/* branches.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify head branch is develop or hotfix/*
        run: |
          HEAD_BRANCH="${{ github.head_ref }}"
          if [ "$HEAD_BRANCH" = "develop" ]; then
            echo "Promotion PR from develop — allowed."
          elif [[ "$HEAD_BRANCH" == hotfix/* ]]; then
            echo "Hotfix PR — allowed."
          else
            echo "::error::PRs to main must come from 'develop' or a 'hotfix/*' branch (got '$HEAD_BRANCH')."
            exit 1
          fi
