version: 2
updates:
  - package-ecosystem: "npm"
    # Single root entry only. pnpm workspaces keep one lockfile at the repo
    # root, and the "/" job already updates every package manifest plus the
    # lockfile. Per-package "/packages/*" entries produced PRs that modified
    # only package.json, which can never pass `pnpm install --frozen-lockfile`.
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Minor/patch dev-dependency updates are bundled into one PR; majors and
      # production dependencies arrive individually for focused review.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-patch:
        dependency-type: "production"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
