# Isolated Playwright workload stack — Compose project `componode-pw`.
#
# Every runtime service sits on the internal-only `pwnet` network: no
# container can reach the public internet at run time. Image pulls and
# builds happen before services start (daemon-side), so egress is never
# needed after `docker compose up`.
#
# Host-published ports are loopback-only and use distinct defaults from the
# normal `componode` stack; override them in .env.test if occupied.

name: componode-pw

networks:
  # Isolated runtime LAN — no route off it. All app/agent/importer/mock/test
  # traffic stays here; published ports are impossible by construction.
  pwnet:
    internal: true
  # Front-door network. Only caddy attaches so its debug ports can publish;
  # caddy proxies strictly to configured internal backends, so nothing else
  # gains an egress route.
  pwedge: {}

volumes:
  postgres_data:
  agent_state:

services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PWP_POSTGRES_PASSWORD:?generated by scripts/private-material.ts}
      POSTGRES_DB: componode_pw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [pwnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d componode_pw"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${PWP_POSTGRES_PASSWORD}@postgres:5432/componode_pw
      DATABASE_SSL_MODE: disable
      COOKIE_SECRET: ${PWP_COOKIE_SECRET}
      COMPONODE_SECRETS_KEY: ${PWP_SECRETS_KEY}
      BOOTSTRAP_ADMIN_USERNAME: ${PWP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${PWP_ADMIN_PASSWORD}
      NODE_ENV: production
      LOG_LEVEL: info
      # One trusted proxy hop: the workload Caddy (ADR-093).
      TRUSTED_PROXY_IP: "1"
      PUBLIC_URL: https://app.componode-pw.test
      URL_CHECK_SWEEP_INTERVAL_MS: "1000"
      # Trust the workload CA for all app-originated TLS (mock providers,
      # Dex JWKS, URL Check targets) — no global verification bypass.
      NODE_EXTRA_CA_CERTS: /pw-private/ca.crt
    volumes:
      - ./.env-private:/pw-private:ro
    networks: [pwnet]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.env-private/certs:/certs:ro
    networks:
      pwnet:
        aliases:
          - app.componode-pw.test
          - hub
          - dex.componode-pw.test
      pwedge: {}
    ports:
      - "127.0.0.1:${PW_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${PW_HTTPS_PORT:-8443}:443"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q --no-check-certificate https://app.componode-pw.test/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  dex:
    image: dexidp/dex:v2.44.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./.env-private/dex.yaml:/etc/dex/config.yaml:ro
    networks:
      pwnet:
        aliases:
          - dex
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5556/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mock-github:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: ["node", "--import", "tsx", "mocks/github/server.ts"]
    environment:
      MOCK_PORT: "9443"
      MOCK_TLS_CERT: /pw-private/certs/mock-github.crt
      MOCK_TLS_KEY: /pw-private/certs/mock-github.key
      MOCK_CONTROL_PORT: "9444"
    volumes:
      - ./.env-private:/pw-private:ro
    networks:
      pwnet:
        aliases:
          - mock-github
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9444/__control/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mock-alibaba:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: ["node", "--import", "tsx", "mocks/alibaba/server.ts"]
    environment:
      MOCK_PORT: "9443"
      MOCK_TLS_CERT: /pw-private/certs/mock-alibaba.crt
      MOCK_TLS_KEY: /pw-private/certs/mock-alibaba.key
      MOCK_CONTROL_PORT: "9444"
    volumes:
      - ./.env-private:/pw-private:ro
    networks:
      pwnet:
        aliases:
          - mock-alibaba
          - sts.aliyuncs.com
          - business.aliyuncs.com
          - resourcecenter.aliyuncs.com
          - resourcecenter-intl.aliyuncs.com
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9444/__control/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mock-docker-engine:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: ["node", "--import", "tsx", "mocks/docker-engine/server.ts"]
    environment:
      MOCK_PORT: "2376"
      MOCK_TLS_CERT: /pw-private/certs/docker-engine.crt
      MOCK_TLS_KEY: /pw-private/certs/docker-engine.key
      MOCK_TLS_CA: /pw-private/ca.crt
      MOCK_CONTROL_PORT: "9444"
    volumes:
      - ./.env-private:/pw-private:ro
    networks:
      pwnet:
        aliases:
          - mock-docker-engine
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9444/__control/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mock-url-importers:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: ["node", "--import", "tsx", "mocks/url-importers/server.ts"]
    environment:
      MOCK_PORT: "9080"
      MOCK_CONTROL_PORT: "9444"
    volumes:
      - ./.env-private:/pw-private:ro
    networks:
      pwnet:
        aliases:
          - web-fixture.mock.test
          - api-fixture.mock.test
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9444/__control/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mock-url-check-target:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: ["node", "--import", "tsx", "mocks/url-check-target/server.ts"]
    environment:
      MOCK_PORT: "9080"
      MOCK_CONTROL_PORT: "9444"
      PWP_URLCHECK_BASIC_USER: ${PWP_URLCHECK_BASIC_USER}
      PWP_URLCHECK_BASIC_PASSWORD: ${PWP_URLCHECK_BASIC_PASSWORD}
      PWP_URLCHECK_BEARER_TOKEN: ${PWP_URLCHECK_BEARER_TOKEN}
      PWP_URLCHECK_HEADER_VALUE: ${PWP_URLCHECK_HEADER_VALUE}
    volumes:
      - ./.env-private:/pw-private:ro
    networks:
      pwnet:
        aliases:
          - probe.target.test
          - auth.target.test
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9444/__control/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mock-control:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: ["node", "--import", "tsx", "mocks/control/server.ts"]
    environment:
      MOCK_CONTROL_PORT: "9090"
    networks:
      pwnet:
        aliases:
          - mock-control
    depends_on:
      mock-github:
        condition: service_healthy
      mock-alibaba:
        condition: service_healthy
      mock-docker-engine:
        condition: service_healthy
      mock-url-importers:
        condition: service_healthy
      mock-url-check-target:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/__control/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  agent:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    environment:
      HUB_URL: https://hub
      # Trust the workload CA via the Node default store — passing CA_BUNDLE
      # makes the agent build a packaged-undici dispatcher that is
      # incompatible with the bundled fetch in this runtime.
      NODE_EXTRA_CA_CERTS: /pw-private/ca.crt
      AGENT_ENROLLMENT_TOKEN_FILE: /pw-private/out/agent-token
      AGENT_STATE_DIR: /state
      AGENT_OPS_PORT: "9464"
    volumes:
      - agent_state:/state
      - ./.env-private:/pw-private:ro
    networks: [pwnet]
    depends_on:
      caddy:
        condition: service_healthy
    deploy:
      replicas: 0

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      PW_BASE_URL: https://app.componode-pw.test
      PW_APP_INTERNAL_URL: http://app:3000
      PW_CONTROL_URL: http://mock-control:9090
      PW_RUN_ID: ${PWP_RUN_ID:-local}
    volumes:
      - ./.env-private:/pw-private:ro
      - ./.env-private/out:/pw-private/out
      - ./test-results:/work/test-results
      - ./playwright-report:/work/playwright-report
      - ./.auth:/work/.auth
    networks: [pwnet]
    depends_on:
      caddy:
        condition: service_healthy
      mock-control:
        condition: service_healthy
    deploy:
      replicas: 0
