openapi: 3.0.3
info:
  title: Componode API
  version: 1.0.0
  description: |
    Componode is an open-source, self-hosted Digital Product Asset Management
    (DPAM) tool. This document describes the REST API exposed by the backend
    (`packages/backend`).

    ## Authentication
    Most endpoints require an authenticated session. Sessions are established
    via `POST /api/v1/auth/login` (or OIDC), which sets an `HttpOnly` session
    cookie (`componode_session`). Mutating requests must also send the CSRF
    token returned at login via the `X-CSRF-Token` header (double-submit
    pattern, cookie `componode_csrf`).

    Public endpoints: `POST /auth/login`, `POST /auth/register`,
    `POST /auth/password/reset/confirm`, the OIDC endpoints, and `GET /metrics`
    (no `/api/v1` prefix; network-restricted in production).

    ## Errors
    Error responses use a consistent envelope:
    `{ "code": "<ERROR_CODE>", "message": "...", "details": <optional> }`.
    Error codes are a controlled enum defined in `packages/core`
    (`ERROR_CODES`).

    ## Conventions
    - All routes are prefixed with `/api/v1` except `GET /metrics`.
    - `GET`/`HEAD` routes are side-effect-free on domain state.
    - List queries exclude `RETIRED` records and `GONE` instances unless
      explicitly requested.
    - Entity IDs are UUID v7; human-readable references use `slug`.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Users
  - name: Sessions
  - name: Settings
  - name: Health
  - name: Products
  - name: Components
  - name: ComponentGroups
  - name: Importers
  - name: Organization
  - name: Dashboard
  - name: Search
  - name: Audit
paths:
  # ------------------------------------------------------------------ Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Local username/password login
      description: Public. Rate-limited to 5 requests/minute. Sets session and CSRF cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-z0-9_-]+$'
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/Person' }
                  csrfToken: { type: string }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      security: []
      description: Clears the session and CSRF cookies.
      responses:
        '204': { description: Logged out }
  /auth/register:
    post:
      tags: [Auth]
      summary: Self-registration
      description: |
        Public. Only available when `allow_self_registration` is enabled in app
        settings (returns 404 otherwise). Rate-limited to 3 requests/minute.
        Creates a `VIEWER` user and auto-logs in (sets session + CSRF cookies).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-z0-9_-]+$'
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                displayName: { type: string, maxLength: 100 }
      responses:
        '201':
          description: User created and logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/Person' }
                  csrfToken: { type: string }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Username already taken (`AUTH_USERNAME_TAKEN`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/session:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/Person' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/change:
    post:
      tags: [Auth]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 8, maxLength: 128 }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Generate a password reset token for a user
      x-permission: "password:reset:generate"
      description: Requires the `password:reset:generate` role (Admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        '200':
          description: Reset token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/password/reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm a password reset with a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 1 }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Password reset }
        '400':
          description: Validation failed or invalid/expired/used token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/oidc/status:
    get:
      tags: [Auth]
      summary: Check whether OIDC login is enabled
      security: []
      responses:
        '200':
          description: OIDC status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
  /auth/oidc/login:
    post:
      tags: [Auth]
      summary: Initiate OIDC login (redirects to the IdP, PKCE)
      security: []
      parameters:
        - in: query
          name: redirect_uri
          schema: { type: string, default: '/' }
          description: Post-login redirect target
      responses:
        '302': { description: Redirect to the identity provider }
        '503':
          description: OIDC not configured (`OIDC_NOT_CONFIGURED`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/oidc/callback:
    get:
      tags: [Auth]
      summary: OIDC callback — exchanges code, creates session (JIT provisioning), redirects
      security: []
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the app (session cookie set; `csrf` query param carries the CSRF token)
        '400':
          description: Missing code/state or OIDC failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ----------------------------------------------------------------- Users
  /users:
    get:
      tags: [Users]
      summary: List users
      x-permission: "user:list"
      description: Requires the `user:list` role (Admin).
      parameters:
        - in: query
          name: role
          schema: { $ref: '#/components/schemas/Role' }
        - in: query
          name: isActive
          schema: { type: string, enum: ['true', 'false'] }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user
      x-permission: "user:create"
      description: Requires the `user:create` role (Admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-z0-9_-]+$'
                password: { type: string, minLength: 8, maxLength: 128 }
                role: { $ref: '#/components/schemas/Role' }
                displayName: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                teamId: { type: string, format: uuid }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Username already taken (`AUTH_USERNAME_TAKEN`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /users/me:
    get:
      tags: [Users]
      summary: Get the current user's profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/Person' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID
      x-permission: "user:list"
      description: Requires the `user:list` role (Admin).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/Person' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Update a user (role, display name, email, team, active flag)
      x-permission: "user:update"
      description: Requires the `user:update` role (Admin).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
                displayName: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                teamId: { type: string, format: uuid, nullable: true }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/sessions:
    get:
      tags: [Sessions]
      summary: List sessions for a user
      x-permission: "user:listSessions"
      description: Requires the `user:listSessions` role (Admin).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: User sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------------------------------------------- Sessions
  /sessions:
    get:
      tags: [Sessions]
      summary: List the current user's sessions
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sessions/{id}/revoke:
    post:
      tags: [Sessions]
      summary: Revoke a session by ID
      description: >-
        Users may revoke their own sessions; only Admin may revoke another
        user's session. The `id` is the session's non-secret `publicId`.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------- Settings
  /settings:
    get:
      tags: [Settings]
      summary: Read application settings
      x-permission: "settings:update"
      description: Requires the `settings:update` role (Admin).
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/AppSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Settings]
      summary: Update application settings
      x-permission: "settings:update"
      description: >-
        Requires the `settings:update` role (Admin). Returns 400 if the
        effective merged configuration (stored + env overrides + patch) would
        enable `allowSelfRegistration` while `defaultUserRole` is `ADMIN` —
        public registration must never provision admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowSelfRegistration: { type: boolean }
                sessionIdleTimeoutMs: { type: integer, minimum: 60000 }
                sessionAbsoluteTimeoutMs: { type: integer, minimum: 60000 }
                defaultUserRole: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/AppSettings' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /settings/oidc:
    get:
      tags: [Settings]
      summary: Read OIDC configuration
      x-permission: "oidc:configure"
      description: Requires the `oidc:configure` role (Admin).
      responses:
        '200':
          description: OIDC config
          content:
            application/json:
              schema:
                type: object
                properties:
                  oidcConfig: { $ref: '#/components/schemas/OidcConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      summary: Update OIDC configuration (tests issuer discovery)
      x-permission: "oidc:configure"
      description: Requires the `oidc:configure` role (Admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                issuer: { type: string, format: uri, nullable: true }
                clientId: { type: string, nullable: true }
                clientSecretRef: { type: string, nullable: true }
                roleClaimPath: { type: string, nullable: true }
                claimValueField: { type: string, nullable: true }
                roleMapping:
                  type: object
                  nullable: true
                  additionalProperties: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Updated OIDC config
          content:
            application/json:
              schema:
                type: object
                properties:
                  oidcConfig: { $ref: '#/components/schemas/OidcConfig' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Health
  /health:
    get:
      tags: [Health]
      summary: Health + database connectivity check
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: Unhealthy (database unreachable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  # --------------------------------------------------------------- Products
  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: Free-text search
        - in: query
          name: type
          schema: { $ref: '#/components/schemas/ProductType' }
        - in: query
          name: lifecycle
          schema: { $ref: '#/components/schemas/Lifecycle' }
        - in: query
          name: includeRetired
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/DigitalProduct' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Products]
      summary: Create a product
      x-permission: "product:create"
      description: Requires the `product:create` role (Editor+).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProduct' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/DigitalProduct' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{slug}:
    get:
      tags: [Products]
      summary: Get product detail by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product detail (includes composition edges and dependencies)
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}:
    patch:
      tags: [Products]
      summary: Update a product
      x-permission: "product:update"
      description: Requires the `product:update` role (Editor+).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProduct' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/DigitalProduct' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Products]
      summary: Delete a product
      x-permission: "product:delete"
      description: Requires the `product:delete` role (Editor+).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Product deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{id}/composes:
    post:
      tags: [Products]
      summary: Add a COMPOSES edge (this product composes a child product)
      x-permission: "product:edge:add"
      description: |
        Requires the `product:edge:add` role. `COMPOSES` forms a DAG — adding an
        edge that creates a cycle returns `409` (`CYCLE_DETECTED`). The parent
        must be `BUSINESS_CAPABILITY` or `CUSTOMER_FACING`.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childId]
              additionalProperties: false
              properties:
                childId: { type: string, format: uuid }
      responses:
        '204': { description: Edge added }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Edge would create a cycle (`CYCLE_DETECTED`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Parent type not allowed (`INVALID_EDGE_TYPE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /products/{id}/composes/{childId}:
    delete:
      tags: [Products]
      summary: Remove a COMPOSES edge
      x-permission: "product:edge:remove"
      description: Requires the `product:edge:remove` role.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - in: path
          name: childId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Edge removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}/consumes-from:
    post:
      tags: [Products]
      summary: Add a CONSUMES_FROM edge (this product consumes a platform product)
      x-permission: "product:edge:add"
      description: |
        Requires the `product:edge:add` role. The target must be a product of
        type `PLATFORM` (`INVALID_EDGE_TYPE` on violation).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platformId]
              additionalProperties: false
              properties:
                platformId: { type: string, format: uuid }
      responses:
        '204': { description: Edge added }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Target is not a PLATFORM product (`INVALID_EDGE_TYPE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /products/{id}/consumes-from/{platformId}:
    delete:
      tags: [Products]
      summary: Remove a CONSUMES_FROM edge
      x-permission: "product:edge:remove"
      description: Requires the `product:edge:remove` role.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - in: path
          name: platformId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Edge removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}/depends-on:
    post:
      tags: [Products]
      summary: Add a DEPENDS_ON edge (product depends on a component)
      x-permission: "product:edge:add"
      description: Requires the `product:edge:add` role.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [componentId]
              additionalProperties: false
              properties:
                componentId: { type: string, format: uuid }
      responses:
        '204': { description: Edge added }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Edge type rule violated (`INVALID_EDGE_TYPE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /products/{id}/depends-on/{componentId}:
    delete:
      tags: [Products]
      summary: Remove a DEPENDS_ON edge
      x-permission: "product:edge:remove"
      description: Requires the `product:edge:remove` role.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - in: path
          name: componentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Edge removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------- Components
  /components:
    get:
      tags: [Components]
      summary: List components (paginated, filterable)
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: category
          schema:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
        - in: query
          name: provider
          schema:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
        - in: query
          name: lifecycle
          schema:
            oneOf:
              - { $ref: '#/components/schemas/Lifecycle' }
              - { type: array, items: { $ref: '#/components/schemas/Lifecycle' } }
        - in: query
          name: status
          schema:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
        - in: query
          name: componentGroup
          schema:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
        - in: query
          name: group
          schema:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: sort
          schema: { type: string, enum: [name, lastSeenAt, createdAt], default: name }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
        - in: query
          name: includeRetired
          schema: { type: boolean, default: false }
        - in: query
          name: includeGone
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Paginated component list
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /components/{id}:
    get:
      tags: [Components]
      summary: Get a component by ID
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Component
          content:
            application/json:
              schema:
                type: object
                properties:
                  component: { $ref: '#/components/schemas/Component' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Components]
      summary: Update component group/team assignment
      x-permission: "component:update"
      description: Requires the `component:update` role (Editor+).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                componentGroupId: { type: string, format: uuid, nullable: true }
                teamOwnerId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Updated component
          content:
            application/json:
              schema:
                type: object
                properties:
                  component: { $ref: '#/components/schemas/Component' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

