  # ------------------------------------------------- Credentials
  /credentials:
    get:
      tags: [Credentials]
      summary: List credentials
      x-permission: "credential:read"
      description: >-
        Returns credential metadata only. Secret values are write-only and are
        never exposed by any endpoint — `keyHints` carries the last 4
        characters of each stored key for identification.
      responses:
        '200':
          description: Credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials:
                    type: array
                    items: { $ref: '#/components/schemas/Credential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Credentials]
      summary: Create a credential
      x-permission: "credential:create"
      description: >-
        Requires the `credential:create` role (Admin). For `STORED` (default)
        the `secrets` bundle is encrypted at rest (AES-256-GCM) and never
        returned. For `AGENT_MANAGED` only `secretRefMap` is stored — no
        secret values transit the hub (ADR-117).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 100 }
                kind:
                  type: string
                  enum: [STORED, AGENT_MANAGED]
                  default: STORED
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: Advisory expiry — warns near/past the date, never blocks
                secrets:
                  type: object
                  additionalProperties: { type: string }
                  minProperties: 1
                  description: 'STORED only — key/value bundle (e.g. `{ "token": "ghp_…" }`)'
                secretRefMap:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      env: { type: string }
                      file: { type: string }
                  minProperties: 1
                  description: 'AGENT_MANAGED only — e.g. `{ "token": { "env": "GH_TOKEN" } }`'
      responses:
        '201':
          description: Credential created
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential: { $ref: '#/components/schemas/CredentialDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: Credential store key unavailable (`CREDENTIAL_KEY_UNAVAILABLE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /credentials/{id}:
    get:
      tags: [Credentials]
      summary: Get credential detail
      x-permission: "credential:read"
      description: Returns credential metadata plus its dependents (referencing importer configs, OIDC usage).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Credential detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential: { $ref: '#/components/schemas/CredentialDetail' }
                  dependents: { $ref: '#/components/schemas/CredentialDependents' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Credentials]
      summary: Update, rotate, or revoke a credential
      x-permission: "credential:update"
      description: >-
        Lifecycle update. Passing `secrets` rotates the stored bundle in
        place — the credential id and all importer-config links are
        preserved and a `rotated` audit entry is written. Passing
        `status: "REVOKED"` revokes permanently (one-way; re-activation
        requires a new credential).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, minLength: 1, maxLength: 100 }
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                secrets:
                  type: object
                  additionalProperties: { type: string }
                  minProperties: 1
                  description: STORED only — present = rotate the bundle in place
                secretRefMap:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      env: { type: string }
                      file: { type: string }
                  minProperties: 1
                  description: AGENT_MANAGED only — present = replace the reference map in place
                status:
                  type: string
                  enum: [REVOKED]
      responses:
        '200':
          description: Updated credential metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential: { $ref: '#/components/schemas/CredentialDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Credentials]
      summary: Delete a credential
      x-permission: "credential:delete"
      description: >-
        Permanently deletes the credential and its stored secrets. Returns
        `409 CREDENTIAL_IN_USE` while any importer config or the OIDC
        configuration references it — the problem `details` lists the
        dependents.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Credential deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Credential is referenced (`CREDENTIAL_IN_USE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /credentials/{id}/test:
    post:
      tags: [Credentials]
      summary: Test a credential
      x-permission: "credential:update"
      description: >-
        Dry-runs the credential against an importer's `testSecrets` hook — a
        minimal authenticated probe, no data is imported. `STORED` runs
        in-process; `AGENT_MANAGED` dispatches `credential.test` to the bound
        Import Agent, which resolves the references locally — secret values
        never transit the channel. Returns `400 MANIFEST_NO_TEST` when the
        importer does not implement the hook, `400 CREDENTIAL_REVOKED` for
        revoked credentials, `400 CREDENTIAL_NO_BOUND_AGENT` when no bound
        agent exists, `503 AGENT_OFFLINE` when the bound agent is not
        connected, and `504 AGENT_TEST_TIMEOUT` when the agent never
        responds, and `400 CREDENTIAL_MISSING_KEY` when every bound config's
        credential set no longer covers a required importer key (a reference
        map edited to drop a required key fails here naming the key). An
        upstream auth failure is reported in the body, never as a 4xx.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importerName]
              properties:
                importerName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Importer manifest name (e.g. `github`)
                scope:
                  type: object
                  additionalProperties: true
                  description: Optional importer config overrides for the probe
      responses:
        '200':
          description: Probe result — never carries secret material
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialTestResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Key unavailable (`CREDENTIAL_KEY_UNAVAILABLE`) or bound agent offline (`AGENT_OFFLINE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: Bound agent did not answer in time (`AGENT_TEST_TIMEOUT`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------ Suggestions
  /suggestions:
    get:
      tags: [Suggestions]
      summary: List staged edge suggestions (ADR-113)
      description: |
        The human-review queue of server-generated DEPENDS_ON candidates.
        Any authenticated role may read. `PENDING` rows are sorted by score
        descending and exclude rows whose product or component is `RETIRED`;
        `DISMISSED` returns the permanent decision history ordered by
        `decidedAt` descending.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, DISMISSED], default: PENDING }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Queue page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionListResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /suggestions/{id}/accept:
    post:
      tags: [Suggestions]
      summary: Accept a suggestion — wires the real DEPENDS_ON edge
      x-permission: "product:edge:add"
      description: |
        Requires `product:edge:add` (Editor+) — accepting IS an edge write:
        the edge and its normal `edge_changes` audit entry are produced by
        the standard edge path, and the suggestion is marked `ACCEPTED`
        atomically. `404` when the suggestion (or an endpoint) is gone,
        `409` when it is already decided.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The accepted suggestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion: { $ref: '#/components/schemas/EdgeSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /suggestions/{id}/dismiss:
    post:
      tags: [Suggestions]
      summary: Dismiss a suggestion permanently
      x-permission: "product:edge:add"
      description: |
        Requires `product:edge:add` (Editor+). Marks the row `DISMISSED` with
        `decidedAt`/`decidedBy` — there is no un-dismiss transition and the
        pair is never suggested again.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The dismissed suggestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion: { $ref: '#/components/schemas/EdgeSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /suggestions/rescan:
    post:
      tags: [Suggestions]
      summary: Run a whole-catalog generation pass
      x-permission: "product:edge:add"
      description: |
        Requires `product:edge:add` (Editor+). Runs the signal engine over
        every active product × component pair synchronously — bounded for
        existing catalogs. Stages new `PENDING` rows, rescores existing ones,
        and tombstones newly covered pairs; terminal rows are never touched.
      responses:
        '200':
          description: Pass report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionRescanReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------- Metrics (outside v1)
  /agents:
    get:
      tags: [Agents]
      summary: List import agents
      x-permission: "agent:read"
      description: Requires the `agent:read` role (Admin). Credential and enrollment-token material is never returned.
      responses:
        '200':
          description: Import agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/ImportAgent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Agents]
      summary: Create an import agent
      x-permission: "agent:create"
      description: >-
        Requires the `agent:create` role (Admin). Returns the single-use
        enrollment token **once** — it is stored hashed and can never be
        retrieved again (spec 025, ADR-116).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                allowedImporters:
                  type: array
                  items: { type: string }
                  description: Empty/omitted = all compiled importers. Unknown names are rejected.
      responses:
        '201':
          description: Agent created with enrollment material
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: '#/components/schemas/ImportAgent' }
                  enrollment: { $ref: '#/components/schemas/AgentEnrollment' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /agents/{id}:
    get:
      tags: [Agents]
      summary: Get an import agent
      x-permission: "agent:read"
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Agent detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: '#/components/schemas/AgentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Agents]
      summary: Update an import agent
      x-permission: "agent:update"
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                allowedImporters:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Agent updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: '#/components/schemas/ImportAgent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Agents]
      summary: Delete an import agent
      x-permission: "agent:delete"
      description: >-
        Deletes the agent identity and cascades its connection history
        (`agent_sessions`). Blocked with `AGENT_IN_USE` while importer
        configs are bound to the agent.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Agent deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /agents/{id}/configs:
    get:
      tags: [Agents]
      summary: Importer configs bound to an agent
      x-permission: "agent:read"
      description: >-
        The agent's bound configs with a read-time `agentIncompatible` flag
        (spec 027) — true when the agent is revoked or its non-empty
        `allowedImporters` policy no longer covers the config's importer.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Bound configs
          content:
            application/json:
              schema:
                type: object
                properties:
                  configs:
                    type: array
                    items: { $ref: '#/components/schemas/AgentBoundConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents/{id}/runs:
    get:
      tags: [Agents]
      summary: Runs executed by an agent
      x-permission: "agent:read"
      description: >-
        Recent `import_runs` stamped with this agent, newest first. Run rows
        are durable history — `import_runs.agentId` is not a foreign key.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Agent runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/AgentRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents/{id}/sessions:
    get:
      tags: [Agents]
      summary: Agent connection history
      x-permission: "agent:read"
      description: >-
        Operational session episodes (not append-only audit), newest first.
        Includes remote address, reported versions, and disconnect reason.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Session episodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/AgentSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents/{id}/enroll:
    post:
      tags: [Agents]
      summary: Issue a fresh enrollment token (credential rotation)
      x-permission: "agent:update"
      description: >-
        Returns a new single-use enrollment token, shown once. The previous
        durable credential keeps working until the new token is exchanged —
        then the old credential and its live session are superseded. Rotating
        a revoked agent clears the revocation (re-enablement path).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Fresh enrollment material
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: '#/components/schemas/ImportAgent' }
                  enrollment: { $ref: '#/components/schemas/AgentEnrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents/{id}/revoke:
    post:
      tags: [Agents]
      summary: Revoke the agent credential
      x-permission: "agent:update"
      description: >-
        Invalidates the durable credential and drops any live session. The
        agent identity is preserved; re-enablement requires rotation
        (`POST /agents/{id}/enroll`).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Agent revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: '#/components/schemas/ImportAgent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agent/enroll:
    post:
      tags: [Agents]
      summary: Exchange an enrollment token for a durable agent credential
      description: >-
        Agent-facing endpoint (no browser session). The single-use enrollment
        token shown at agent creation/rotation is exchanged for a durable
        bearer credential. Rejects unknown, used, or expired tokens with
        `AGENT_ENROLLMENT_INVALID`. CSRF-exempt (ADR-087 amendment).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 1 }
      responses:
        '200':
          description: Durable credential issued (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  agentToken: { type: string }
                  agent: { $ref: '#/components/schemas/ImportAgent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /agent/stream:
    get:
      tags: [Agents]
      summary: Agent control stream (WebSocket upgrade)
      description: >-
        Outbound-only agent channel (ADR-116). The agent connects with
        `Authorization: Bearer <durable credential>` and upgrades to
        WebSocket; the first frame must be `hello` (lockstep version check).
        See `docs/agent-protocol.md` for the message contract. Rejects bad or
        revoked credentials with `AGENT_CREDENTIAL_INVALID` before upgrade.
      security:
        - agentBearer: []
      responses:
        '101':
          description: WebSocket upgrade accepted
        '401': { $ref: '#/components/responses/Unauthorized' }
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: |
        Unauthenticated endpoint served **without** the `/api/v1` prefix
        (`GET /metrics`). Network-policy-restricted in production (Docker
        Compose internal network).
      servers:
        - url: /
      security: []
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain:
              schema: { type: string }

components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: Entity ID (UUID v7)
    IdOrSlug:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: Entity ID (UUID v7) or slug — UUID-shaped values match id first, then slug
  responses:
    ValidationFailed:
      description: Input validation failed (`VALIDATION_FAILED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Not authenticated (`AUTH_NO_SESSION`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Insufficient role (`AUTH_FORBIDDEN`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found (`NOT_FOUND`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflict (e.g. `CONFLICT`, `CYCLE_DETECTED`, `SLUG_TAKEN`, `REFERENCED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
        - message
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code generated by the origin server.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        code:
          type: string
          enum:
            - AUTH_INVALID_CREDENTIALS
            - AUTH_RATE_LIMITED
            - AUTH_NO_SESSION
            - AUTH_FORBIDDEN
            - AUTH_USERNAME_TAKEN
            - AUTH_RESET_TOKEN_INVALID
            - AUTH_RESET_TOKEN_EXPIRED
            - AUTH_RESET_TOKEN_USED
            - OIDC_NOT_CONFIGURED
            - OIDC_INVALID_STATE
            - OIDC_INVALID_CODE
            - OIDC_TOKEN_VERIFICATION_FAILED
            - OIDC_DISCOVERY_FAILED
            - CSRF_TOKEN_MISMATCH
            - VALIDATION_FAILED
            - NOT_FOUND
            - CONFLICT
            - CYCLE_DETECTED
            - INVALID_EDGE_TYPE
            - PAYLOAD_TOO_LARGE
            - REFERENCED
            - TYPE_CHANGE_BLOCKED
            - SLUG_TAKEN
            - SLUG_CONFLICT
            - CONFIG_NOT_FOUND
            - RUN_IN_PROGRESS
            - RUN_NOT_ACTIVE
            - INTERNAL_ERROR
            - CREDENTIAL_NOT_FOUND
            - CREDENTIAL_IN_USE
            - CREDENTIAL_REVOKED
            - CREDENTIAL_MISSING_KEY
            - CREDENTIAL_KEY_COLLISION
            - CREDENTIAL_KEY_UNAVAILABLE
            - MANIFEST_NO_TEST
            - CONVERSION_NOTHING_TO_CONVERT
            - LEGACY_SECRET_UNRESOLVABLE
            - AGENT_NOT_FOUND
            - AGENT_NAME_TAKEN
            - AGENT_IN_USE
            - AGENT_ENROLLMENT_INVALID
            - AGENT_CREDENTIAL_INVALID
            - AGENT_VERSION_MISMATCH
            - AGENT_OFFLINE
            - AGENT_TEST_TIMEOUT
            - AGENT_UNAVAILABLE
            - AGENT_INCOMPATIBLE
            - AGENT_LOST
            - ASSET_TOO_LARGE
            - CREDENTIAL_NO_BOUND_AGENT
            - CREDENTIAL_KIND_MISMATCH
        message: { type: string }
        details: { type: object, nullable: true, description: Optional machine-readable context (e.g. Zod issues, retryAfter). }
        invalid-params:
          type: array
          nullable: true
          description: RFC 7807 invalid-params extension for validation failures.
          items:
            type: object
            properties:
              name: { type: string }
              reason: { type: string }

    ActivityFeedItem:
      description: >-
        An entity change or an edge change. Entity-kind items carry
        `entityName`; edge-kind items carry `fromEntityName`/`toEntityName` —
        display names resolved at read time, null when unresolvable.
      oneOf:
        - type: object
          properties:
            kind: { type: string, enum: [entity] }
            id: { type: string, format: uuid }
            entityType: { type: string }
            entityId: { type: string, nullable: true }
            entityName: { type: string, nullable: true }
            action: { type: string }
            changes: { type: object, nullable: true }
            createdBy: { type: string, format: uuid, nullable: true }
            createdByName: { type: string, nullable: true }
            importRunId: { type: string, format: uuid, nullable: true }
            createdAt: { type: string, format: date-time }
        - type: object
          properties:
            kind: { type: string, enum: [edge] }
            id: { type: string, format: uuid }
            edgeType: { type: string }
            fromEntityType: { type: string }
            fromEntityId: { type: string }
            fromEntityName: { type: string, nullable: true }
            toEntityType: { type: string }
            toEntityId: { type: string }
            toEntityName: { type: string, nullable: true }
            action: { type: string }
            reason: { type: string, nullable: true }
            createdBy: { type: string, format: uuid, nullable: true }
            createdByName: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
    EntityChange:
      type: object
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string, nullable: true }
        entityName:
          type: string
          nullable: true
          description: Display name resolved server-side at read time; null when the entity is gone or the type has no name
        action: { type: string }
        changes: { type: object, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        createdByName: { type: string, nullable: true }
        importRunId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    Role:
      type: string
      enum: [ADMIN, EDITOR, VIEWER]
    Lifecycle:
      type: string
      enum: [ACTIVE, RETIRED]
    InstanceStatus:
      type: string
      enum: [RUNNING, STOPPED, ERROR, GONE]
    ProductType:
      type: string
      enum: [BUSINESS_CAPABILITY, PLATFORM, CUSTOMER_FACING]
    Person:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        oidcSubject: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        displayName: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        slug: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Non-secret public identifier. The bearer token is never returned.
        tokenLast4:
          type: string
          description: Last 4 characters of the session token (display only)
        userId: { type: string, format: uuid }
        device:
          type: string
          nullable: true
          description: Coarse "Browser · OS" label parsed from the user-agent captured at session creation
        ip:
          type: string
          nullable: true
          description: Client IP address captured at session creation
        current:
          type: boolean
          description: True when this row is the session making the request
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
    AppSettings:
      type: object
      properties:
        allowSelfRegistration: { type: boolean }
        sessionIdleTimeoutMs: { type: integer }
        sessionAbsoluteTimeoutMs: { type: integer }
        defaultUserRole: { $ref: '#/components/schemas/Role' }
    OidcConfig:
      type: object
      properties:
        enabled: { type: boolean }
        issuer: { type: string, nullable: true }
        clientId: { type: string, nullable: true }
        clientSecretRef:
          type: string
          nullable: true
          deprecated: true
        clientSecretCredentialId: { type: string, format: uuid, nullable: true }
        roleClaimPath: { type: string, nullable: true }
        claimValueField: { type: string, nullable: true }
        roleMapping:
          type: object
          nullable: true
          additionalProperties: { type: string }
        updatedAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status: { type: string, enum: [healthy, unhealthy] }
        database: { type: string, enum: [connected, disconnected] }
        uptime: { type: number }
        version: { type: string }
    Link:
      type: object
      required: [title, url]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        url: { type: string, format: uri, description: 'http(s) URLs only' }
    ProductCriticality:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
    DigitalProduct:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/ProductType' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        lobOwnerId: { type: string, format: uuid, nullable: true }
        teamOwnerId: { type: string, format: uuid, nullable: true }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }
        tags:
          type: array
          items: { type: string }
        criticality: { $ref: '#/components/schemas/ProductCriticality', nullable: true }
        sunsetAt: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [RUNNING, STOPPED, 'ERROR']
          nullable: true
          description: >-
            Derived product health headline (ADR-112), present on list
            responses — `null` when there are no contributing instances
        completeness: { $ref: '#/components/schemas/ProductCompleteness' }
        consumedByCount:
          type: integer
          description: >-
            Spec 023 US5: CONSUMES_FROM in-degree — every consumer edge,
            including retired consumers, so the figure always equals
            `consumedBy.length` on the detail payload. `0` for
            non-platforms (only PLATFORM can be a CONSUMES_FROM target).
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AttentionItem:
      type: object
      properties:
        kind:
          type: string
          enum:
            - FAILED_RUN
            - INSTANCE_ERROR
            - INSTANCE_GONE
            - PRODUCT_ERROR
            - OFFLINE_AGENT
            - CREDENTIAL_EXPIRING
            - SUNSET_OVERDUE_PRODUCT
            - SUNSET_OVERDUE_COMPONENT
          description: >-
            `OFFLINE_AGENT` (spec 027) surfaces an offline Import Agent that
            still owns bound configs. `CREDENTIAL_EXPIRING` (spec 040,
            ADR-116 Amendment 4) surfaces an ACTIVE credential whose
            `expiresAt` is past or inside the 30-day warning window —
            ranked below the operational failure kinds and above the
            sunset kinds. Sunset kinds (spec 023) surface overdue
            `sunsetAt` on non-RETIRED entities; they rank last.
        label: { type: string }
        detail:
          type: string
          nullable: true
          description: >-
            Spec 040: server-composed one-line context (e.g. last-heartbeat
            + disconnect reason, run error summary, expiry distance);
            null when the kind has nothing to add beyond the label
        href: { type: string }
        at: { type: string, format: date-time }
    CatalogCoverage:
      type: object
      description: >-
        Spec 023: read-only catalog coverage derived per request — no
        persisted state. The component population is the default-visible
        set (ACTIVE, not instances-all-GONE).
      properties:
        components:
          type: object
          properties:
            active: { type: integer }
            wired: { type: integer }
            wiredPct:
              type: number
              nullable: true
              description: "`null` when `active` is zero"
        products:
          type: object
          properties:
            total: { type: integer, description: Non-RETIRED products }
            missingOwner: { type: integer }
            missingDependencies: { type: integer }
            missingDescription: { type: integer }
    ProductCompleteness:
      type: object
      description: >-
        Spec 023 US4: three independent completeness facets — never a
        score. `dependencies` is false when the recursive dependency
        surface is empty.
      properties:
        owner:
          type: boolean
          description: Product has a LOB or team owner assigned
        description:
          type: boolean
          description: Product has a non-empty description
        dependencies:
          type: boolean
          description: Recursive dependency surface is non-empty
    ComponentDependent:
      type: object
      description: >-
        A non-RETIRED product holding a direct DEPENDS_ON edge on a
        component (ADR-017 platform promotion workflow)
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        type: { $ref: '#/components/schemas/ProductType' }
    CreateProduct:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Auto-derived from name when omitted
        type: { $ref: '#/components/schemas/ProductType' }
        description: { type: string, maxLength: 2000, nullable: true }
        lobOwnerId: { type: string, format: uuid, nullable: true }
        teamOwnerId: { type: string, format: uuid, nullable: true }
        links:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Link' }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 32, pattern: '^[a-z0-9][a-z0-9._:-]*$' }
        criticality: { $ref: '#/components/schemas/ProductCriticality', nullable: true }
        sunsetAt: { type: string, format: date-time, nullable: true }
        componentIds:
          type: array
          minItems: 1
          maxItems: 100
          description: |
            Existing component ids wired as DEPENDS_ON edges atomically with
            the create (spec 021). Unknown ids → `404` with `details.missingIds`.
          items: { type: string, format: uuid }
    UpdateProduct:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: { type: string, maxLength: 2000, nullable: true }
        type: { $ref: '#/components/schemas/ProductType' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        lobOwnerId: { type: string, format: uuid, nullable: true }
        teamOwnerId: { type: string, format: uuid, nullable: true }
        links:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Link' }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 32, pattern: '^[a-z0-9][a-z0-9._:-]*$' }
        criticality: { $ref: '#/components/schemas/ProductCriticality', nullable: true }
        sunsetAt: { type: string, format: date-time, nullable: true }
    BootstrapDocument:
      type: object
      required: [version, products]
      additionalProperties: false
      properties:
        version: { type: integer, enum: [1] }
        products:
          type: array
          items: { $ref: '#/components/schemas/BootstrapProductItem' }
    BootstrapProductItem:
      type: object
      required: [name, type]
      additionalProperties: false
      description: |
        No `slug` field — the upsert key is derived from `name`. Absent
        fields preserve the current value; explicit `null`/`[]` clears.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/ProductType' }
        description: { type: string, maxLength: 2000, nullable: true }
        owner:
          type: object
          additionalProperties: false
          description: Entity slugs; each key merges independently, `null` clears
          properties:
            lob: { type: string, minLength: 1, maxLength: 100, nullable: true }
            team: { type: string, minLength: 1, maxLength: 100, nullable: true }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 32, pattern: '^[a-z0-9][a-z0-9._:-]*$' }
        criticality: { $ref: '#/components/schemas/ProductCriticality', nullable: true }
        sunsetAt: { type: string, format: date-time, nullable: true }
        dependsOn:
          type: array
          description: Component refs resolved slug → name → externalId
          items: { type: string, minLength: 1 }
    EdgeSuggestionReason:
      type: string
      enum: [NAME_MATCH, TOPIC_TAG_MATCH, NAMESPACE_MATCH]
    EdgeSuggestionStatus:
      type: string
      enum: [PENDING, ACCEPTED, DISMISSED, SUPERSEDED]
    EdgeSuggestion:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        componentId: { type: string, format: uuid }
        reason:
          allOf:
            - { $ref: '#/components/schemas/EdgeSuggestionReason' }
          nullable: true
          description: NULL on coverage tombstones
        score:
          type: number
          nullable: true
          description: Signal score (e.g. 1.05); NULL on tombstones
        status: { $ref: '#/components/schemas/EdgeSuggestionStatus' }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        decidedBy: { type: string, format: uuid, nullable: true }
    SuggestionQueueItem:
      allOf:
        - { $ref: '#/components/schemas/EdgeSuggestion' }
        - type: object
          properties:
            product:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                slug: { type: string }
            component:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                slug: { type: string }
                category: { type: string }
            decidedByName: { type: string, nullable: true }
    SuggestionListResult:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SuggestionQueueItem' }
        total: { type: integer }
    SuggestionRescanReport:
      type: object
      properties:
        productsScanned: { type: integer }
        componentsScanned: { type: integer }
        staged: { type: integer }
        superseded: { type: integer }
    BootstrapReport:
      type: object
      required: [created, updated, edgesAdded, skipped]
      properties:
        created: { type: integer }
        updated: { type: integer }
        edgesAdded: { type: integer }
        skipped:
          type: array
          items:
            type: object
            required: [item, reason]
            properties:
              item: { type: string }
              reason: { type: string }
    Component:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { type: string }
        provider: { type: string }
        resourceType: { type: string }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        teamOwnerId: { type: string, format: uuid, nullable: true }
        componentGroupId: { type: string, format: uuid, nullable: true }
        externalId: { type: string, nullable: true }
        details: { type: object, nullable: true }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }
        tags:
          type: array
          items: { type: string }
        sunsetAt: { type: string, format: date-time, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        worstStatus:
          type: string
          nullable: true
          description: >-
            List-enrichment rollup (spec 039): worst observed
            `component_instances.status` (ERROR > GONE > STOPPED >
            RUNNING); null when the component has no instances.
            Present on list responses.
        instanceCount:
          type: integer
          description: Instance count (present on list responses)
        lastSeenInRunId: { type: string, format: uuid, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ComponentGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        teamOwnerId: { type: string, format: uuid, nullable: true }
        memberCount:
          type: integer
          description: Current member components (present on list responses)
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImporterConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        importerName: { type: string }
        label: { type: string }
        scope: { type: object }
        secretRefs:
          type: array
          nullable: true
          description: >-
            Masked secret references — only the logical `key` is returned.
            `env`/`file` locations are accepted on write but never exposed
            by the API.
          items:
            type: object
            properties:
              key: { type: string }
        credentialIds:
          type: array
          items: { type: string, format: uuid }
          description: Stored credentials resolved for this config
        secretRefsDeprecated:
          type: boolean
          description: True when the config still relies on legacy env/file refs
        agentId:
          type: string
          format: uuid
          nullable: true
          description: Executing Import Agent; null = in-process execution
        agent:
          type: object
          nullable: true
          description: Summary of the bound agent, null when unbound
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            status:
              type: string
              enum: [NEVER_CONNECTED, CONNECTED, OFFLINE]
        agentIncompatible:
          type: boolean
          description: >-
            Read-time flag (spec 027 US6): true when the bound agent is
            revoked or its non-empty `allowedImporters` policy does not
            cover this config's importer. Never persisted.
        schedule: { type: string, nullable: true }
        enabled: { type: boolean }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImportAgent:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [NEVER_CONNECTED, CONNECTED, OFFLINE]
        agentVersion: { type: string, nullable: true }
        protocolVersion: { type: integer, nullable: true }
        importerVersions:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              version: { type: string }
        allowedImporters:
          type: array
          items: { type: string }
          description: Hub-managed policy; empty = all importers
        maxConcurrentJobs: { type: integer, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        reportedStatus:
          $ref: '#/components/schemas/AgentReportedStatus'
          nullable: true
          description: >-
            Latest agent-reported ops snapshot (spec 028); null = not
            reported by this agent
        lastHeartbeatAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Freshness of the live session's last accepted frame; null when
            no session is established (fall back to lastSeenAt)
        lastDisconnectReason:
          type: string
          nullable: true
          enum: [client_close, heartbeat_timeout, revoked, shutdown, superseded, replaced]
          description: >-
            disconnectReason of the most recent closed session; null when
            the agent has no session history
        revokedAt: { type: string, format: date-time, nullable: true }
        hasCredential:
          type: boolean
          description: Durable credential has been issued (hash never exposed)
        pendingEnrollment:
          type: boolean
          description: An unused, unexpired enrollment token exists
        boundConfigCount:
          type: integer
          description: Importer configs bound to this agent
        runningJobs:
          type: integer
          description: >-
            Jobs the hub believes this agent currently holds (live dispatch
            map, spec 027 — not persisted)
        createdBy:
          type: string
          nullable: true
          description: >-
            Spec 040: display name of the person who enrolled the agent
            (`COALESCE(displayName, username)`); null when the actor column
            is unset or the person no longer resolves — never a raw id
        enrollmentExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Spec 040: expiry of the live pending-enrollment token; null
            when no unused, unexpired token exists
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentReportedStatus:
      type: object
      description: >-
        Agent-reported ops snapshot, persisted from the heartbeat `ops`
        payload (spec 028). Counters cover the agent's current process
        lifetime and reset on restart.
      properties:
        reportedAt: { type: string, format: date-time }
        receivedAt:
          type: string
          format: date-time
          description: Hub-stamped receipt time — agent clocks are never trusted
        uptimeSeconds: { type: integer }
        activeJobs: { type: integer }
        jobs:
          type: object
          properties:
            assigned: { type: integer }
            completed: { type: integer }
            failed: { type: integer }
            cancelled: { type: integer }
        assetsStreamed: { type: integer }
        credentialTests:
          type: object
          properties:
            dispatched: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
        secretResolutionFailures: { type: integer }
        reconnects: { type: integer }
    AgentDetail:
      allOf:
        - $ref: '#/components/schemas/ImportAgent'
        - type: object
          properties:
            activeRuns:
              type: array
              items: { $ref: '#/components/schemas/AgentActiveRun' }
              description: In-flight remote jobs on this agent (spec 027)
    AgentActiveRun:
      type: object
      description: In-flight remote job, from the hub's live dispatch map
      properties:
        runId: { type: string, format: uuid }
        configId: { type: string, format: uuid }
        configLabel: { type: string }
        state:
          type: string
          enum: [ASSIGNED, RUNNING]
        phase: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
    AgentBoundConfig:
      type: object
      description: Importer config bound to an agent — the agent detail configs tab
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        importerName: { type: string }
        schedule: { type: string, nullable: true }
        enabled: { type: boolean }
        agentIncompatible:
          type: boolean
          description: Bound agent revoked or policy misses this importer
    AgentRun:
      type: object
      description: Import run executed by an agent — durable history
      properties:
        id: { type: string, format: uuid }
        configId: { type: string, format: uuid }
        configLabel: { type: string }
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED, INTERRUPTED]
        errorType: { type: string, nullable: true }
        currentPhase: { type: string, nullable: true }
        assetsProcessed: { type: integer }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
    AgentEnrollment:
      type: object
      description: Shown exactly once at issuance; never retrievable afterwards
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
    AgentSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        connectedAt: { type: string, format: date-time }
        disconnectedAt: { type: string, format: date-time, nullable: true }
        disconnectReason:
          type: string
          nullable: true
          enum: [client_close, heartbeat_timeout, revoked, shutdown, superseded, replaced]
        remoteAddress: { type: string, nullable: true }
        agentVersion: { type: string, nullable: true }
        protocolVersion: { type: integer, nullable: true }
        importerVersions:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              version: { type: string }
    ImportRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        configId: { type: string, format: uuid }
        agentId:
          type: string
          format: uuid
          nullable: true
          description: Executing Import Agent; null = in-process execution
        agentName:
          type: string
          nullable: true
          description: Joined agent display name; null when run is in-process or agent was deleted
        credentialIds:
          type: array
          nullable: true
          items: { type: string, format: uuid }
          description: Stored credentials resolved by this run
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED, INTERRUPTED]
        triggeredBy: { type: string, format: uuid, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        assetsProcessed: { type: integer }
        assetsCreated: { type: integer }
        assetsUpdated: { type: integer }
        instancesOrphaned: { type: integer }
        componentsRetired: { type: integer }
        currentPhase: { type: string, nullable: true }
        cancelRequestedAt: { type: string, format: date-time, nullable: true }
        errorMessage: { type: string, nullable: true }
        errorType: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ImportRunError:
      type: object
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        assetExternalId: { type: string, nullable: true }
        errorType: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
    Credential:
      type: object
      description: >-
        Credential metadata, as returned by list and detail responses.
        Secret values are write-only — `keyHints` shows the last 4
        characters of each stored key, never the value. For `AGENT_MANAGED`
        credentials the value lives on the agent host and `keyHints`
        instead carries the source type (`env`/`file`) per key; reference
        names are exposed only on `CredentialDetail` (`secretRefMap`),
        never in list views (ADR-117 Amendment 1).
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        label: { type: string }
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        kind:
          type: string
          enum: [STORED, AGENT_MANAGED]
          description: >-
            `STORED` — values encrypted on the hub (AES-256-GCM).
            `AGENT_MANAGED` — references only; values live on the Import
            Agent host and never transit the hub (ADR-117).
        keyHints:
          type: object
          additionalProperties: { type: string }
          description: >-
            STORED: last-4 hint per key. AGENT_MANAGED: ref source type
            (`env`/`file`) per key.
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CredentialDetail:
      description: >-
        A `Credential` plus the agent-managed reference map — returned by
        `GET /credentials/{id}` and by create/update responses. Reference
        names (env vars, file paths) are detail-only data (ADR-117).
      allOf:
        - $ref: '#/components/schemas/Credential'
        - type: object
          properties:
            secretRefMap:
              type: object
              additionalProperties:
                type: object
                properties:
                  env: { type: string }
                  file: { type: string }
              description: >-
                AGENT_MANAGED only — maps secret key → `{env}` or `{file}`
                reference on the agent host. Never present for STORED.
    CredentialDependents:
      type: object
      properties:
        importerConfigs:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
        oidc:
          type: boolean
          description: Whether the OIDC configuration references this credential
    CredentialTestResult:
      type: object
      required: [ok]
      description: >-
        Result of `POST /credentials/{id}/test`. Never carries secret
        material — `error` is a sanitized, status-level message.
      properties:
        ok: { type: boolean }
        error:
          type: string
          description: Failure reason (e.g. "Authentication failed (401)")
        agent:
          type: string
          description: >-
            Present for AGENT_MANAGED credentials — name of the Import Agent
            that executed the remote test.
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        lobId:
          type: string
          format: uuid
          nullable: true
          description: Associated Line of Business (spec 034); null when unassociated
        lob:
          type: object
          nullable: true
          description: Resolved LOB summary; null when unassociated
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        memberCount:
          type: integer
          description: Persons assigned to the team (spec 039, G22)
        componentCount:
          type: integer
          description: Components owned by the team (spec 039)
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LineOfBusiness:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateOrgEntity:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: { type: string, maxLength: 2000, nullable: true }
    UpdateOrgEntity:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: { type: string, maxLength: 2000, nullable: true }
    CreateTeam:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: { type: string, maxLength: 2000, nullable: true }
        lobId:
          type: string
          format: uuid
          nullable: true
          description: Associated Line of Business; must reference an existing LOB
    UpdateTeam:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: { type: string, maxLength: 2000, nullable: true }
        lobId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Associated Line of Business; must reference an existing
            LOB. Null clears the association.
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: componode_session
      description: Session cookie set by login/register/OIDC callback
    agentBearer:
      type: http
      scheme: bearer
      description: Durable Import Agent credential (spec 025, ADR-116)
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on mutating requests (double-submit CSRF)
security:
  - sessionCookie: []
