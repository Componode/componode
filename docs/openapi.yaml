  # -------------------------------------------------------------- Importers
  /importers:
    get:
      tags: [Importers]
      summary: List available importer manifests
      responses:
        '200':
          description: Importer manifests
          content:
            application/json:
              schema:
                type: object
                properties:
                  importers:
                    type: array
                    items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /importers/{name}/schema:
    get:
      tags: [Importers]
      summary: Get an importer's config schema
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
          description: Importer name (e.g. `github`, `aws`, `kubernetes`)
      responses:
        '200':
          description: Importer config schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  configSchema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /importer-configs:
    get:
      tags: [Importers]
      summary: List importer configurations
      responses:
        '200':
          description: Importer configs
          content:
            application/json:
              schema:
                type: object
                properties:
                  configs:
                    type: array
                    items: { $ref: '#/components/schemas/ImporterConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Importers]
      summary: Create an importer configuration
      x-permission: "importer:config:create"
      description: Requires the `importer:config:create` role (Admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importerName, label]
              properties:
                importerName: { type: string, minLength: 1 }
                label: { type: string, minLength: 1, maxLength: 100 }
                scope:
                  type: object
                  default: {}
                  description: Importer-specific scope/config
                secretRefs:
                  type: array
                  default: []
                  items:
                    type: object
                    required: [key]
                    properties:
                      key: { type: string, minLength: 1 }
                      env: { type: string }
                      file: { type: string }
                    description: Either `env` or `file` must be provided.
                schedule: { type: string, description: Cron schedule }
                enabled: { type: boolean, default: true }
      responses:
        '201':
          description: Config created
          content:
            application/json:
              schema:
                type: object
                properties:
                  config: { $ref: '#/components/schemas/ImporterConfig' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /importer-configs/{id}:
    get:
      tags: [Importers]
      summary: Get an importer configuration
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Importer config
          content:
            application/json:
              schema:
                type: object
                properties:
                  config: { $ref: '#/components/schemas/ImporterConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Importers]
      summary: Update an importer configuration
      x-permission: "importer:config:update"
      description: Requires the `importer:config:update` role (Admin).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                importerName: { type: string, minLength: 1 }
                label: { type: string, minLength: 1, maxLength: 100 }
                scope: { type: object }
                secretRefs:
                  type: array
                  items:
                    type: object
                    required: [key]
                    properties:
                      key: { type: string, minLength: 1 }
                      env: { type: string }
                      file: { type: string }
                schedule: { type: string }
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated config
          content:
            application/json:
              schema:
                type: object
                properties:
                  config: { $ref: '#/components/schemas/ImporterConfig' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Importers]
      summary: Delete an importer configuration
      x-permission: "importer:config:delete"
      description: Requires the `importer:config:delete` role (Admin).
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Config deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /importer-configs/{id}/trigger:
    post:
      tags: [Importers]
      summary: Trigger an import run
      x-permission: "importer:run:trigger"
      description: Requires the `importer:run:trigger` role.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '202':
          description: Run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A run is already in progress for this config (`RUN_IN_PROGRESS`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /importer-configs/{id}/runs:
    get:
      tags: [Importers]
      summary: List runs for an importer configuration
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/ImportRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /importer-configs/{configId}/runs/{runId}:
    get:
      tags: [Importers]
      summary: Get an import run
      parameters:
        - in: path
          name: configId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: '#/components/schemas/ImportRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /importer-configs/{configId}/runs/{runId}/errors:
    get:
      tags: [Importers]
      summary: List errors for an import run
      parameters:
        - in: path
          name: configId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Run errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/ImportRunError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /importer-configs/{configId}/runs/{runId}/cancel:
    post:
      tags: [Importers]
      summary: Cancel a running or pending import run
      x-permission: "importer:run:cancel"
      description: Requires the `importer:run:cancel` role.
      parameters:
        - in: path
          name: configId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Run cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Run is not active (`RUN_NOT_ACTIVE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

