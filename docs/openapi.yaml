  # ----------------------------------------------------------------- Search
  /search:
    get:
      tags: [Search]
      summary: Global search (Ctrl+K palette)
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: Search results grouped by entity type
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ Audit
  /audit/activity:
    get:
      tags: [Audit]
      summary: Global activity feed
      x-permission: audit:feed
      parameters:
        - in: query
          name: kind
          schema: { type: string, enum: [entity, edge] }
        - in: query
          name: entityType
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: actor
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paginated activity feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit/entities/{entityType}/{entityId}:
    get:
      tags: [Audit]
      summary: Per-entity history
      parameters:
        - in: path
          name: entityType
          required: true
          schema: { type: string }
        - in: path
          name: entityId
          required: true
          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string, enum: [entity, edge] }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: actor
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paginated entity history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /audit/corrections:
    post:
      tags: [Audit]
      summary: Append a correction entry
      x-permission: audit:correct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryId, entryKind, note]
              properties:
                entryId:
                  type: string
                entryKind:
                  type: string
                  enum: [entity, edge]
                note:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: Correction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /importer-configs/{configId}/runs/{runId}/changes:
    get:
      tags: [Importers]
      summary: Import-run consequential changes
      parameters:
        - in: path
          name: configId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Changes and errors for the run
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes: { type: array, items: { $ref: '#/components/schemas/EntityChange' } }
                  errors: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------- Metrics (outside v1)
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: |
        Unauthenticated endpoint served **without** the `/api/v1` prefix
        (`GET /metrics`). Network-policy-restricted in production (Docker
        Compose internal network).
      servers:
        - url: /
      security: []
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain:
              schema: { type: string }

components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: Entity ID (UUID v7)
  responses:
    ValidationFailed:
      description: Input validation failed (`VALIDATION_FAILED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Not authenticated (`AUTH_NO_SESSION`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Insufficient role (`AUTH_FORBIDDEN`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found (`NOT_FOUND`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflict (e.g. `CONFLICT`, `CYCLE_DETECTED`, `SLUG_TAKEN`, `REFERENCED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
        - message
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code generated by the origin server.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        code:
          type: string
          enum:
            - AUTH_INVALID_CREDENTIALS
            - AUTH_RATE_LIMITED
            - AUTH_NO_SESSION
            - AUTH_FORBIDDEN
            - AUTH_USERNAME_TAKEN
            - AUTH_RESET_TOKEN_INVALID
            - AUTH_RESET_TOKEN_EXPIRED
            - AUTH_RESET_TOKEN_USED
            - OIDC_NOT_CONFIGURED
            - OIDC_INVALID_STATE
            - OIDC_INVALID_CODE
            - OIDC_TOKEN_VERIFICATION_FAILED
            - OIDC_DISCOVERY_FAILED
            - CSRF_TOKEN_MISMATCH
            - VALIDATION_FAILED
            - NOT_FOUND
            - CONFLICT
            - CYCLE_DETECTED
            - INVALID_EDGE_TYPE
            - REFERENCED
            - TYPE_CHANGE_BLOCKED
            - SLUG_TAKEN
            - SLUG_CONFLICT
            - CONFIG_NOT_FOUND
            - RUN_IN_PROGRESS
            - RUN_NOT_ACTIVE
            - INTERNAL_ERROR
        message: { type: string }
        details: { type: object, nullable: true, description: Optional machine-readable context (e.g. Zod issues, retryAfter). }
        invalid-params:
          type: array
          nullable: true
          description: RFC 7807 invalid-params extension for validation failures.
          items:
            type: object
            properties:
              name: { type: string }
              reason: { type: string }

    EntityChange:
      type: object
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string, nullable: true }
        action: { type: string }
        changes: { type: object, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        createdByName: { type: string, nullable: true }
        importRunId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    Role:
      type: string
      enum: [ADMIN, EDITOR, VIEWER]
    Lifecycle:
      type: string
      enum: [ACTIVE, RETIRED]
    InstanceStatus:
      type: string
      enum: [RUNNING, STOPPED, ERROR, GONE]
    ProductType:
      type: string
      enum: [BUSINESS_CAPABILITY, PLATFORM, CUSTOMER_FACING]
    Person:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        oidcSubject: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        displayName: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        slug: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Non-secret public identifier. The bearer token is never returned.
        tokenLast4:
          type: string
          description: Last 4 characters of the session token (display only)
        userId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
    AppSettings:
      type: object
      properties:
        allowSelfRegistration: { type: boolean }
        sessionIdleTimeoutMs: { type: integer }
        sessionAbsoluteTimeoutMs: { type: integer }
        defaultUserRole: { $ref: '#/components/schemas/Role' }
    OidcConfig:
      type: object
      properties:
        enabled: { type: boolean }
        issuer: { type: string, nullable: true }
        clientId: { type: string, nullable: true }
        clientSecretRef: { type: string, nullable: true }
        roleClaimPath: { type: string, nullable: true }
        claimValueField: { type: string, nullable: true }
        roleMapping:
          type: object
          nullable: true
          additionalProperties: { type: string }
        updatedAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status: { type: string, enum: [healthy, unhealthy] }
        database: { type: string, enum: [connected, disconnected] }
        uptime: { type: number }
        version: { type: string }
    DigitalProduct:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/ProductType' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        lobOwnerId: { type: string, format: uuid, nullable: true }
        teamOwnerId: { type: string, format: uuid, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateProduct:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Auto-derived from name when omitted
        type: { $ref: '#/components/schemas/ProductType' }
        description: { type: string, maxLength: 2000, nullable: true }
        lobOwnerId: { type: string, format: uuid, nullable: true }
        teamOwnerId: { type: string, format: uuid, nullable: true }
    UpdateProduct:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: { type: string, maxLength: 2000, nullable: true }
        type: { $ref: '#/components/schemas/ProductType' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        lobOwnerId: { type: string, format: uuid, nullable: true }
        teamOwnerId: { type: string, format: uuid, nullable: true }
    Component:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { type: string }
        provider: { type: string }
        resourceType: { type: string }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        teamOwnerId: { type: string, format: uuid, nullable: true }
        componentGroupId: { type: string, format: uuid, nullable: true }
        externalId: { type: string, nullable: true }
        details: { type: object, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        lastSeenInRunId: { type: string, format: uuid, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ComponentGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        teamOwnerId: { type: string, format: uuid, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImporterConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        importerName: { type: string }
        label: { type: string }
        scope: { type: object }
        secretRefs:
          type: array
          nullable: true
          description: >-
            Masked secret references — only the logical `key` is returned.
            `env`/`file` locations are accepted on write but never exposed
            by the API.
          items:
            type: object
            properties:
              key: { type: string }
        schedule: { type: string, nullable: true }
        enabled: { type: boolean }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImportRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        configId: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED, INTERRUPTED]
        triggeredBy: { type: string, format: uuid, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        assetsProcessed: { type: integer }
        assetsCreated: { type: integer }
        assetsUpdated: { type: integer }
        instancesOrphaned: { type: integer }
        componentsRetired: { type: integer }
        currentPhase: { type: string, nullable: true }
        cancelRequestedAt: { type: string, format: date-time, nullable: true }
        errorMessage: { type: string, nullable: true }
        errorType: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ImportRunError:
      type: object
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        assetExternalId: { type: string, nullable: true }
        errorType: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LineOfBusiness:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateOrgEntity:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: { type: string, maxLength: 2000, nullable: true }
    UpdateOrgEntity:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: { type: string, maxLength: 2000, nullable: true }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: componode_session
      description: Session cookie set by login/register/OIDC callback
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on mutating requests (double-submit CSRF)
security:
  - sessionCookie: []
